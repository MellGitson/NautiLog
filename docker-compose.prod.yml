services:

  db:
    image: postgres:15-alpine
    container_name: nautilog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nautilog_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nautilog_api
    restart: unless-stopped
    volumes:
      - ./backend/public/uploads:/var/www/api/public/uploads
      - jwt_keys:/var/www/api/config/jwt
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      APP_ENCRYPT_KEY: ${APP_ENCRYPT_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_TOKEN_TTL: 3600
      CORS_ALLOW_ORIGIN: '^https://(www\.)?nautilog\.fr$$'
      DEFAULT_URI: https://nautilog.fr
      MAILER_DSN: ${MAILER_DSN:-null://null}
      CONTACT_DESTINATAIRE: ${CONTACT_DESTINATAIRE:-contact@nautilog.fr}
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - nautilog_network

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: nautilog_client
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - nautilog_network

  nginx:
    image: nginx:alpine
    container_name: nautilog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public/uploads:/var/www/api/public/uploads
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - nautilog_network

  certbot:
    image: certbot/certbot
    container_name: nautilog_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  db_data:
  jwt_keys:

networks:
  nautilog_network:
    driver: bridge
