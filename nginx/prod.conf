server {
    listen 80;
    server_name nautilog.fr www.nautilog.fr;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nautilog.fr www.nautilog.fr;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/nautilog.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nautilog.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s;

    add_header X-Frame-Options              "DENY"                              always;
    add_header X-Content-Type-Options       "nosniff"                           always;
    add_header X-XSS-Protection             "1; mode=block"                     always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"   always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://nautilog.fr" always;
    add_header Permissions-Policy           "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;

    # Frontend React (build statique)
    location / {
        set $client_upstream client:80;
        proxy_pass http://$client_upstream;
        proxy_set_header Host $host;
    }

    # Fichiers uploadés (photos de bateaux, etc.)
    location /uploads {
        alias /var/www/api/public/uploads;
        add_header Cache-Control "public, max-age=3600";
    }

    # Backend Symfony API
    location /api {
        root /var/www/api/public;
        rewrite ^/api(/.*)?$ /index.php break;

        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
    }
}
